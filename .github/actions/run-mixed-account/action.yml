name: run-mixed-account
description: Run one mixed-batch account without persisting credentials

inputs:
  artifact-name:
    description: Sanitized result artifact name
    required: true
  previous-artifact:
    description: Previous round result artifact used for component hydration
    required: false
    default: ""
  retry-components:
    description: Comma-separated incomplete components for this attempt
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: h3/requirements.txt
    - name: Download previous account result
      if: inputs.previous-artifact != ''
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.previous-artifact }}
        path: previous-result
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --timeout 60 --retries 3 -r h3/requirements.txt
        timeout 900 python -m playwright install --with-deps chromium
    - name: Select source account
      shell: bash
      run: |
        set +x
        python - <<'PY'
        import os
        from h3.mixed_batches import GROUP_CODES
        code = os.environ['SOURCE_GROUP'].strip().lower()
        if code not in GROUP_CODES:
            raise SystemExit(f'unsupported frozen source group: {code}')
        lines = [
            line.strip()
            for line in os.environ.get(code, '').splitlines()
            if line.strip() and ',' in line
        ]
        index = int(os.environ['ACCOUNT_INDEX'])
        if index <= 0 or index > len(lines):
            raise SystemExit(f'frozen account index is unavailable: {code} row {index}')
        username, password = lines[index - 1].split(',', 1)
        print(f"::add-mask::{username}")
        print(f"::add-mask::{password}")
        with open('.account-credentials', 'w', encoding='utf-8') as credentials:
            credentials.write(username + '\n' + password + '\n')
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
            output.write('ACCOUNT_CREDENTIAL_FILE=.account-credentials\n')
            output.write(f"RETRY_COMPONENTS={os.environ.get('ACTION_RETRY_COMPONENTS', '')}\n")
            previous = os.path.join('previous-result', 'result.json')
            if os.path.exists(previous):
                output.write(f'PREVIOUS_RESULT_PATH={previous}\n')
        PY
      env:
        ACTION_RETRY_COMPONENTS: ${{ inputs.retry-components }}
    - name: Run incomplete account components
      shell: bash
      env:
        RESULT_JSON_PATH: result.json
      run: |
        set +x
        trap 'rm -f "$ACCOUNT_CREDENTIAL_FILE"' EXIT
        timeout 2100 python h3/script.py
    - name: Ensure sanitized result
      if: always()
      shell: bash
      run: |
        python h3/fallback_result.py result.json
        python h3/mixed_results.py stamp result.json
        rm -f .account-credentials
    - name: Upload account result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: result.json
        if-no-files-found: error
        retention-days: 2
