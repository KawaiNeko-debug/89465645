name: dynamic-group

run-name: group-${{ inputs.orchestration_id }}-${{ inputs.group_code }}

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        required: true
        type: string
      group_code:
        required: true
        type: string
      task_start_date:
        required: true
        type: string
      continue_chain:
        required: false
        default: "false"
        type: string
      chain_state:
        required: false
        default: ""
        type: string
      components:
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      group_code:
        required: true
        type: string
      task_start_date:
        required: false
        type: string
      continue_chain:
        required: false
        default: "false"
        type: string
      chain_state:
        required: false
        default: ""
        type: string
      components:
        required: false
        default: ""
        type: string

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  old1: ${{ secrets.old1 }}
  old2: ${{ secrets.old2 }}
  old3: ${{ secrets.old3 }}
  old4: ${{ secrets.old4 }}
  old5: ${{ secrets.old5 }}
  old6: ${{ secrets.old6 }}
  old7: ${{ secrets.old7 }}
  old8: ${{ secrets.old8 }}
  old9: ${{ secrets.old9 }}
  old10: ${{ secrets.old10 }}
  old11: ${{ secrets.old11 }}
  old12: ${{ secrets.old12 }}
  old13: ${{ secrets.old13 }}
  old14: ${{ secrets.old14 }}
  old15: ${{ secrets.old15 }}
  old16: ${{ secrets.old16 }}
  old17: ${{ secrets.old17 }}
  old18: ${{ secrets.old18 }}
  old19: ${{ secrets.old19 }}
  old20: ${{ secrets.old20 }}
  new1: ${{ secrets.new1 }}
  new2: ${{ secrets.new2 }}
  new3: ${{ secrets.new3 }}
  new4: ${{ secrets.new4 }}
  new5: ${{ secrets.new5 }}
  new6: ${{ secrets.new6 }}
  new7: ${{ secrets.new7 }}
  new8: ${{ secrets.new8 }}
  new9: ${{ secrets.new9 }}
  new10: ${{ secrets.new10 }}
  new11: ${{ secrets.new11 }}
  new12: ${{ secrets.new12 }}
  new13: ${{ secrets.new13 }}
  new14: ${{ secrets.new14 }}
  new15: ${{ secrets.new15 }}
  new16: ${{ secrets.new16 }}
  new17: ${{ secrets.new17 }}
  new18: ${{ secrets.new18 }}
  new19: ${{ secrets.new19 }}
  new20: ${{ secrets.new20 }}
  ll1: ${{ secrets.ll1 }}
  ll2: ${{ secrets.ll2 }}
  ll3: ${{ secrets.ll3 }}
  ll4: ${{ secrets.ll4 }}
  ll5: ${{ secrets.ll5 }}
  ll6: ${{ secrets.ll6 }}
  ll7: ${{ secrets.ll7 }}
  ll8: ${{ secrets.ll8 }}
  ll9: ${{ secrets.ll9 }}
  ll10: ${{ secrets.ll10 }}
  ll11: ${{ secrets.ll11 }}
  ll12: ${{ secrets.ll12 }}
  ll13: ${{ secrets.ll13 }}
  ll14: ${{ secrets.ll14 }}
  ll15: ${{ secrets.ll15 }}
  ll16: ${{ secrets.ll16 }}
  ll17: ${{ secrets.ll17 }}
  ll18: ${{ secrets.ll18 }}
  ll19: ${{ secrets.ll19 }}
  ll20: ${{ secrets.ll20 }}
  zh1: ${{ secrets.zh1 }}
  zh2: ${{ secrets.zh2 }}
  zh3: ${{ secrets.zh3 }}
  zh4: ${{ secrets.zh4 }}
  zh5: ${{ secrets.zh5 }}
  zh6: ${{ secrets.zh6 }}
  zh7: ${{ secrets.zh7 }}
  zh8: ${{ secrets.zh8 }}
  zh9: ${{ secrets.zh9 }}
  zh10: ${{ secrets.zh10 }}
  zh11: ${{ secrets.zh11 }}
  zh12: ${{ secrets.zh12 }}
  zh13: ${{ secrets.zh13 }}
  zh14: ${{ secrets.zh14 }}
  zh15: ${{ secrets.zh15 }}
  zh16: ${{ secrets.zh16 }}
  zh17: ${{ secrets.zh17 }}
  zh18: ${{ secrets.zh18 }}
  zh19: ${{ secrets.zh19 }}
  zh20: ${{ secrets.zh20 }}
  test: ${{ secrets.TEST }}

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      account_category: ${{ steps.matrix.outputs.account_category }}
      execution_mode: ${{ steps.matrix.outputs.execution_mode }}
      skip_sign: ${{ steps.matrix.outputs.skip_sign }}
    env:
      GROUP_CODE: ${{ inputs.group_code }}
      ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os, random, re
          code = os.environ['GROUP_CODE'].strip().lower()
          if code != 'test' and not re.fullmatch(r'(old|new|ll|zh)([1-9]|1[0-9]|20)', code):
              raise SystemExit(f'unsupported group code: {code}')
          lines = [line.strip() for line in os.environ.get(code, '').splitlines() if line.strip() and ',' in line]
          if code == 'test':
              lines = lines[:1]
          if not lines:
              raise SystemExit(f'{code} is empty')
          if code.startswith('old'):
              category, skip = '老号全干组', False
          elif code.startswith('new'):
              category, skip = '新号全干组', False
          elif code.startswith(('ll', 'zh')):
              category, skip = '同行不签到组', True
          else:
              category, skip = '测试组', False
          indexes = list(range(1, len(lines) + 1))
          random.Random(os.environ.get('ORCHESTRATION_ID', '')).shuffle(indexes)
          matrix = {
              'include': [
                  {'account_index': index, 'execution_order': order}
                  for order, index in enumerate(indexes, start=1)
              ]
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
              output.write(f"count={len(lines)}\n")
              output.write(f"account_category={category}\n")
              output.write(f"execution_mode={'skip_sign' if skip else 'full'}\n")
              output.write(f"skip_sign={'true' if skip else 'false'}\n")
          PY

  run:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSPORT_URL: ${{ secrets.PASSPORT_URL }}
      REFERER: ${{ secrets.REFERER }}
      SLIDER_ID: ${{ secrets.SLIDER_ID }}
      WRAPPER_ID: ${{ secrets.WRAPPER_ID }}
      HEADER_CLIENT_TYPE: ${{ secrets.HEADER_CLIENT_TYPE }}
      HEADER_ACCESS_TOKEN: ${{ secrets.HEADER_ACCESS_TOKEN }}
      HEADER_ACCESS_TOKEN_FALLBACKS: ${{ secrets.HEADER_ACCESS_TOKEN_FALLBACKS }}
      HEADER_SECRET_KEY: ${{ secrets.HEADER_SECRET_KEY }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      TOKEN_ALTERNATIVE_KEYS: ${{ secrets.TOKEN_ALTERNATIVE_KEYS }}
      API_SIGN_PATH: ${{ secrets.API_SIGN_PATH }}
      BANNED_ACCOUNTS: ${{ secrets.BANNED_ACCOUNTS }}
      RISK_CONTROL_MESSAGE: ${{ secrets.RISK_CONTROL_MESSAGE }}
      MEMBER_API_BASE: ${{ secrets.MEMBER_API_BASE }}
      VOTE_CAMPAIGN_URL: ${{ secrets.VOTE_CAMPAIGN_URL }}
      VOTE_API_BASE: ${{ secrets.VOTE_API_BASE }}
      ACCOUNT_DATA_ENABLED: "true"
      SIGN_TASK_START_DATE: ${{ inputs.task_start_date }}
      GROUP_NAME: ${{ inputs.group_code }}
      GROUP_CODE: ${{ inputs.group_code }}
      ACCOUNT_CATEGORY: ${{ needs.prepare.outputs.account_category }}
      EXECUTION_MODE: ${{ needs.prepare.outputs.execution_mode }}
      SKIP_SIGN: ${{ needs.prepare.outputs.skip_sign }}
      ACCOUNT_INDEX: ${{ matrix.account_index }}
      EXECUTION_ORDER: ${{ matrix.execution_order }}
      RETRY_COMPONENTS: ${{ inputs.components }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --timeout 60 --retries 3 -r h3/requirements.txt
          timeout 900 python -m playwright install --with-deps chromium
      - name: Select account
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import os
          code = os.environ['GROUP_CODE'].strip().lower()
          lines = [line.strip() for line in os.environ[code].splitlines() if line.strip() and ',' in line]
          if code == 'test':
              lines = lines[:1]
          username, password = lines[int(os.environ['ACCOUNT_INDEX']) - 1].split(',', 1)
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          with open('.account-credentials', 'w', encoding='utf-8') as credentials:
              credentials.write(username + '\n' + password + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ACCOUNT_CREDENTIAL_FILE=.account-credentials\n')
          PY
      - name: Run account
        timeout-minutes: 35
        env:
          RESULT_JSON_PATH: result.json
        run: |
          set +x
          trap 'rm -f "$ACCOUNT_CREDENTIAL_FILE"' EXIT
          python h3/script.py
      - name: Ensure result
        if: always()
        run: python h3/fallback_result.py result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-${{ matrix.account_index }}
          path: result.json
          retention-days: 2

  prepare_retry:
    needs: [prepare, run]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.retry_matrix.outputs.matrix }}
      has_failed: ${{ steps.retry_matrix.outputs.has_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: initial-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-*
          path: initial-results
      - id: retry_matrix
        env:
          EXPECTED_COUNT: ${{ needs.prepare.outputs.count }}
        run: python h3/retry_components.py matrix initial-results "$EXPECTED_COUNT"

  retry:
    needs: [prepare, prepare_retry]
    if: always() && needs.prepare_retry.outputs.has_failed == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare_retry.outputs.matrix) }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSPORT_URL: ${{ secrets.PASSPORT_URL }}
      REFERER: ${{ secrets.REFERER }}
      SLIDER_ID: ${{ secrets.SLIDER_ID }}
      WRAPPER_ID: ${{ secrets.WRAPPER_ID }}
      HEADER_CLIENT_TYPE: ${{ secrets.HEADER_CLIENT_TYPE }}
      HEADER_ACCESS_TOKEN: ${{ secrets.HEADER_ACCESS_TOKEN }}
      HEADER_ACCESS_TOKEN_FALLBACKS: ${{ secrets.HEADER_ACCESS_TOKEN_FALLBACKS }}
      HEADER_SECRET_KEY: ${{ secrets.HEADER_SECRET_KEY }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      TOKEN_ALTERNATIVE_KEYS: ${{ secrets.TOKEN_ALTERNATIVE_KEYS }}
      API_SIGN_PATH: ${{ secrets.API_SIGN_PATH }}
      BANNED_ACCOUNTS: ${{ secrets.BANNED_ACCOUNTS }}
      RISK_CONTROL_MESSAGE: ${{ secrets.RISK_CONTROL_MESSAGE }}
      MEMBER_API_BASE: ${{ secrets.MEMBER_API_BASE }}
      VOTE_CAMPAIGN_URL: ${{ secrets.VOTE_CAMPAIGN_URL }}
      VOTE_API_BASE: ${{ secrets.VOTE_API_BASE }}
      ACCOUNT_DATA_ENABLED: "true"
      SIGN_TASK_START_DATE: ${{ inputs.task_start_date }}
      GROUP_NAME: ${{ inputs.group_code }}
      GROUP_CODE: ${{ inputs.group_code }}
      ACCOUNT_CATEGORY: ${{ needs.prepare.outputs.account_category }}
      EXECUTION_MODE: ${{ needs.prepare.outputs.execution_mode }}
      SKIP_SIGN: ${{ needs.prepare.outputs.skip_sign }}
      ACCOUNT_INDEX: ${{ matrix.account_index }}
      EXECUTION_ORDER: ${{ matrix.execution_order }}
      RETRY_COMPONENTS: ${{ matrix.retry_components }}
      PREVIOUS_RESULT_PATH: previous-result/result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - name: Download previous result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: initial-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-${{ matrix.account_index }}
          path: previous-result
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --timeout 60 --retries 3 -r h3/requirements.txt
          timeout 900 python -m playwright install --with-deps chromium
      - name: Select account
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import os
          code = os.environ['GROUP_CODE'].strip().lower()
          lines = [line.strip() for line in os.environ[code].splitlines() if line.strip() and ',' in line]
          if code == 'test':
              lines = lines[:1]
          username, password = lines[int(os.environ['ACCOUNT_INDEX']) - 1].split(',', 1)
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          with open('.account-credentials', 'w', encoding='utf-8') as credentials:
              credentials.write(username + '\n' + password + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ACCOUNT_CREDENTIAL_FILE=.account-credentials\n')
          PY
      - name: Retry incomplete components on fresh runner
        timeout-minutes: 35
        env:
          RESULT_JSON_PATH: result.json
        run: |
          set +x
          trap 'rm -f "$ACCOUNT_CREDENTIAL_FILE"' EXIT
          python h3/script.py
      - name: Ensure retry result
        if: always()
        run: python h3/fallback_result.py result.json
      - name: Upload retry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r1-${{ matrix.account_index }}
          path: result.json
          retention-days: 2

  prepare_retry2:
    needs: [prepare, retry]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.retry_matrix.outputs.matrix }}
      has_failed: ${{ steps.retry_matrix.outputs.has_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r1-*
          path: retry1-results
      - id: retry_matrix
        env:
          EXPECTED_COUNT: ${{ needs.prepare.outputs.count }}
          RETRY_CANDIDATE_MATRIX: ${{ needs.prepare_retry.outputs.matrix }}
        run: python h3/retry_components.py matrix retry1-results "$EXPECTED_COUNT"

  retry2:
    needs: [prepare, prepare_retry2]
    if: always() && needs.prepare_retry2.outputs.has_failed == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare_retry2.outputs.matrix) }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSPORT_URL: ${{ secrets.PASSPORT_URL }}
      REFERER: ${{ secrets.REFERER }}
      SLIDER_ID: ${{ secrets.SLIDER_ID }}
      WRAPPER_ID: ${{ secrets.WRAPPER_ID }}
      HEADER_CLIENT_TYPE: ${{ secrets.HEADER_CLIENT_TYPE }}
      HEADER_ACCESS_TOKEN: ${{ secrets.HEADER_ACCESS_TOKEN }}
      HEADER_ACCESS_TOKEN_FALLBACKS: ${{ secrets.HEADER_ACCESS_TOKEN_FALLBACKS }}
      HEADER_SECRET_KEY: ${{ secrets.HEADER_SECRET_KEY }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      TOKEN_ALTERNATIVE_KEYS: ${{ secrets.TOKEN_ALTERNATIVE_KEYS }}
      API_SIGN_PATH: ${{ secrets.API_SIGN_PATH }}
      BANNED_ACCOUNTS: ${{ secrets.BANNED_ACCOUNTS }}
      RISK_CONTROL_MESSAGE: ${{ secrets.RISK_CONTROL_MESSAGE }}
      MEMBER_API_BASE: ${{ secrets.MEMBER_API_BASE }}
      VOTE_CAMPAIGN_URL: ${{ secrets.VOTE_CAMPAIGN_URL }}
      VOTE_API_BASE: ${{ secrets.VOTE_API_BASE }}
      ACCOUNT_DATA_ENABLED: "true"
      SIGN_TASK_START_DATE: ${{ inputs.task_start_date }}
      GROUP_NAME: ${{ inputs.group_code }}
      GROUP_CODE: ${{ inputs.group_code }}
      ACCOUNT_CATEGORY: ${{ needs.prepare.outputs.account_category }}
      EXECUTION_MODE: ${{ needs.prepare.outputs.execution_mode }}
      SKIP_SIGN: ${{ needs.prepare.outputs.skip_sign }}
      ACCOUNT_INDEX: ${{ matrix.account_index }}
      EXECUTION_ORDER: ${{ matrix.execution_order }}
      RETRY_COMPONENTS: ${{ matrix.retry_components }}
      PREVIOUS_RESULT_PATH: previous-result/result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - name: Download previous result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r1-${{ matrix.account_index }}
          path: previous-result
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --timeout 60 --retries 3 -r h3/requirements.txt
          timeout 900 python -m playwright install --with-deps chromium
      - name: Select account
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import os
          code = os.environ['GROUP_CODE'].strip().lower()
          lines = [line.strip() for line in os.environ[code].splitlines() if line.strip() and ',' in line]
          username, password = lines[int(os.environ['ACCOUNT_INDEX']) - 1].split(',', 1)
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          with open('.account-credentials', 'w', encoding='utf-8') as credentials:
              credentials.write(username + '\n' + password + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ACCOUNT_CREDENTIAL_FILE=.account-credentials\n')
          PY
      - name: Retry incomplete components on fresh runner
        timeout-minutes: 35
        env:
          RESULT_JSON_PATH: result.json
        run: |
          set +x
          trap 'rm -f "$ACCOUNT_CREDENTIAL_FILE"' EXIT
          python h3/script.py
      - name: Ensure retry result
        if: always()
        run: python h3/fallback_result.py result.json
      - name: Upload retry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r2-${{ matrix.account_index }}
          path: result.json
          retention-days: 2

  prepare_retry3:
    needs: [prepare, retry2]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.retry_matrix.outputs.matrix }}
      has_failed: ${{ steps.retry_matrix.outputs.has_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r2-*
          path: retry2-results
      - id: retry_matrix
        env:
          EXPECTED_COUNT: ${{ needs.prepare.outputs.count }}
          RETRY_CANDIDATE_MATRIX: ${{ needs.prepare_retry2.outputs.matrix }}
        run: python h3/retry_components.py matrix retry2-results "$EXPECTED_COUNT"

  retry3:
    needs: [prepare, prepare_retry3]
    if: always() && needs.prepare_retry3.outputs.has_failed == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare_retry3.outputs.matrix) }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSPORT_URL: ${{ secrets.PASSPORT_URL }}
      REFERER: ${{ secrets.REFERER }}
      SLIDER_ID: ${{ secrets.SLIDER_ID }}
      WRAPPER_ID: ${{ secrets.WRAPPER_ID }}
      HEADER_CLIENT_TYPE: ${{ secrets.HEADER_CLIENT_TYPE }}
      HEADER_ACCESS_TOKEN: ${{ secrets.HEADER_ACCESS_TOKEN }}
      HEADER_ACCESS_TOKEN_FALLBACKS: ${{ secrets.HEADER_ACCESS_TOKEN_FALLBACKS }}
      HEADER_SECRET_KEY: ${{ secrets.HEADER_SECRET_KEY }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      TOKEN_ALTERNATIVE_KEYS: ${{ secrets.TOKEN_ALTERNATIVE_KEYS }}
      API_SIGN_PATH: ${{ secrets.API_SIGN_PATH }}
      BANNED_ACCOUNTS: ${{ secrets.BANNED_ACCOUNTS }}
      RISK_CONTROL_MESSAGE: ${{ secrets.RISK_CONTROL_MESSAGE }}
      MEMBER_API_BASE: ${{ secrets.MEMBER_API_BASE }}
      VOTE_CAMPAIGN_URL: ${{ secrets.VOTE_CAMPAIGN_URL }}
      VOTE_API_BASE: ${{ secrets.VOTE_API_BASE }}
      ACCOUNT_DATA_ENABLED: "true"
      SIGN_TASK_START_DATE: ${{ inputs.task_start_date }}
      GROUP_NAME: ${{ inputs.group_code }}
      GROUP_CODE: ${{ inputs.group_code }}
      ACCOUNT_CATEGORY: ${{ needs.prepare.outputs.account_category }}
      EXECUTION_MODE: ${{ needs.prepare.outputs.execution_mode }}
      SKIP_SIGN: ${{ needs.prepare.outputs.skip_sign }}
      ACCOUNT_INDEX: ${{ matrix.account_index }}
      EXECUTION_ORDER: ${{ matrix.execution_order }}
      RETRY_COMPONENTS: ${{ matrix.retry_components }}
      PREVIOUS_RESULT_PATH: previous-result/result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - name: Download previous result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r2-${{ matrix.account_index }}
          path: previous-result
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --timeout 60 --retries 3 -r h3/requirements.txt
          timeout 900 python -m playwright install --with-deps chromium
      - name: Select account
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import os
          code = os.environ['GROUP_CODE'].strip().lower()
          lines = [line.strip() for line in os.environ[code].splitlines() if line.strip() and ',' in line]
          username, password = lines[int(os.environ['ACCOUNT_INDEX']) - 1].split(',', 1)
          print(f"::add-mask::{username}")
          print(f"::add-mask::{password}")
          with open('.account-credentials', 'w', encoding='utf-8') as credentials:
              credentials.write(username + '\n' + password + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ACCOUNT_CREDENTIAL_FILE=.account-credentials\n')
          PY
      - name: Retry incomplete components on fresh runner
        timeout-minutes: 35
        env:
          RESULT_JSON_PATH: result.json
        run: |
          set +x
          trap 'rm -f "$ACCOUNT_CREDENTIAL_FILE"' EXIT
          python h3/script.py
      - name: Ensure retry result
        if: always()
        run: python h3/fallback_result.py result.json
      - name: Upload retry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r3-${{ matrix.account_index }}
          path: result.json
          retention-days: 2

  finalize:
    needs: [prepare, run, prepare_retry, retry, prepare_retry2, retry2, prepare_retry3, retry3]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dispatcher dependency
        run: python -m pip install --timeout 60 --retries 3 requests
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: initial-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-*
          path: account-results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retry-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}-r*-*
          path: account-results
      - name: Merge group results
        if: always()
        run: python h3/merge_results.py account-results merged/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-result-${{ inputs.orchestration_id }}-${{ inputs.group_code }}
          path: merged/result.json
          retention-days: 2
      - name: Continue account group chain
        if: ${{ always() && inputs.continue_chain == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          CHAIN_STATE: ${{ inputs.chain_state }}
        run: >-
          python h3/dynamic_groups.py advance
          --chain-state-env CHAIN_STATE
          --current-group "${{ inputs.group_code }}"
          --current-run-id "${{ github.run_id }}"
          --current-result merged/result.json
          --output chain-state.json
