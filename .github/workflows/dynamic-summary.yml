permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHAIN_STATE: ${{ inputs.chain_state }}
      SUMMARY_CATEGORY_FILTER: ${{ inputs.summary_category }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONFIDENTIAL_PASSWORDS: ${{ secrets.CONFIDENTIAL_PASSWORDS }}
      NOTIFY_CHANNELS: telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - name: Install report dependencies
        run: python -m pip install --timeout 60 --retries 3 requests openpyxl
      - name: Download exact group artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python h3/dynamic_groups.py download --chain-state-env CHAIN_STATE --output-dir results
      - name: Generate and send category reports
        run: python h3/category_reports.py results
      - name: Upload category reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-reports-${{ inputs.orchestration_id }}
          path: |
            results/manifest.json
            results/*.xlsx
          if-no-files-found: warn
          retention-days: 3
