name: runner-recovery

on:
  workflow_run:
    workflows: [dynamic-group, dynamic-batch]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --timeout 60 --retries 3 requests
      - name: Rerun only a completely unassigned account run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python h3/runner_recovery.py
