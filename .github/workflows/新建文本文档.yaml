name: 自动总结组6(免签到)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: read # 允许使用 gh cli 读取其他 workflow 的运行记录和下载 artifact

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        shell: bash
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS_BATCH6 }}
        run: |
          python - <<'PY'
          import os
          lines = [l.strip() for l in os.environ['ACCOUNTS'].splitlines() if l.strip()]
          count = len(lines)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"count={count}\n")
          PY

  summary:
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install notify deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Auto-download latest results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在查找 账户组6 (sign-batch6.yml) 的最新运行记录..."
          
          # 自动获取 sign-batch6.yml 最近一次运行的 Run ID
          RUN_ID=$(gh run list --workflow "sign-batch6.yml" --limit 1 --json databaseId --jq '.[0].databaseId')
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "❌ 未找到 sign-batch6.yml 的运行记录，请确保之前执行过签到。"
            exit 1
          fi
          
          echo "✅ 找到最新的 Run ID: $RUN_ID"
          echo "正在下载结果文件..."
          
          # 创建结果目录并下载该 run 产生的所有 artifacts
          mkdir -p results
          gh run download $RUN_ID --dir results
          
          echo "✅ 下载完成！文件列表如下："
          ls -R results

      - name: Summarize and notify
        env:
          GROUP_NAME: 账户组6
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.count }}
          TOTAL_ACCOUNTS: ${{ needs.prepare.outputs.count }}
          NOTIFY_CHANNELS: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USE_SSL: ${{ secrets.SMTP_SSL }}
          ACCOUNTS_BATCH6: ${{ secrets.ACCOUNTS_BATCH6 }}
          TELEGRAM_SEND_XLSX: "true"
          TELEGRAM_SEND_TEXT: "true"
        run: |
          # 运行报表脚本生成 Excel 附件并发送
          python h3/report.py results