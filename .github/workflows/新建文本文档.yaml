name: 单独总结组6(免签到)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '【可选】输入之前签到成功的 Run ID。如果你的结果文件已直接保存在仓库的 results 文件夹中，请留空！'
        required: false
        type: string

env:
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: read 

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        shell: bash
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS_BATCH6 }}
        run: |
          python - <<'PY'
          import os
          lines = [l.strip() for l in os.environ['ACCOUNTS'].splitlines() if l.strip()]
          count = len(lines)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"count={count}\n")
          PY

  summary:
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install notify deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Fetch Artifacts by Run ID
        if: ${{ github.event.inputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在根据提供的 Run ID: ${{ github.event.inputs.run_id }} 下载数据..."
          mkdir -p results
          gh run download ${{ github.event.inputs.run_id }} --dir results || echo "⚠️ 下载可能不完整或找不到该记录"

      - name: Summarize and notify
        env:
          GROUP_NAME: 账户组6
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.count }}
          TOTAL_ACCOUNTS: ${{ needs.prepare.outputs.count }}
          NOTIFY_CHANNELS: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USE_SSL: ${{ secrets.SMTP_SSL }}
          ACCOUNTS_BATCH6: ${{ secrets.ACCOUNTS_BATCH6 }}
          TELEGRAM_SEND_XLSX: "true"
          TELEGRAM_SEND_TEXT: "true"
        run: |
          # 确保目录存在，防止 Python 报错
          mkdir -p results
          echo "当前 results 目录下的文件："
          ls -R results
          
          # 执行汇总并发送
          python h3/report.py results