name: 单独总结组6(免签到)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "可选：填写今天账户组6签到 workflow 的 Run ID；留空则自动找今天最新完成的组6运行"
        required: false
        type: string
      telegram_text:
        description: "是否发送文字总结"
        required: false
        default: true
        type: boolean
      telegram_xlsx:
        description: "是否发送 xlsx"
        required: false
        default: true
        type: boolean

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        shell: bash
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS_BATCH6 }}
        run: |
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ.get("ACCOUNTS", "").splitlines() if line.strip()]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={len(lines)}\n")
          PY

  summary:
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install notify deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Resolve group6 run id
        id: resolve_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDED_RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")

          def local_date(value):
              if not value:
                  return ""
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(tz).strftime("%Y-%m-%d")

          provided = (os.getenv("PROVIDED_RUN_ID") or "").strip()
          if provided:
              run_id = provided
              source = "input"
          else:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "run",
                      "list",
                      "--workflow",
                      "sign-batch6.yaml",
                      "--limit",
                      "30",
                      "--json",
                      "databaseId,createdAt,status,conclusion",
                  ],
                  text=True,
                  encoding="utf-8",
              )
              runs = json.loads(raw)
              today = datetime.now(tz).strftime("%Y-%m-%d")
              completed = [run for run in runs if run.get("status") == "completed"]
              today_runs = [run for run in completed if local_date(run.get("createdAt")) == today]
              candidates = today_runs or completed
              if not candidates:
                  raise SystemExit("未找到已完成的账户组6运行记录，请手动填写 run_id。")
              picked = candidates[0]
              run_id = str(picked["databaseId"])
              source = "today" if today_runs else "latest-completed"

          print(f"使用账户组6 Run ID: {run_id} ({source})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_id={run_id}\n")
          PY

      - name: Download group6 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve_run.outputs.run_id }}
        run: |
          mkdir -p results
          gh run download "$RUN_ID" --dir results
          json_count="$(find results -type f -name '*.json' | wc -l)"
          if [ "$json_count" -eq 0 ]; then
            echo "::error::没有下载到 result.json。可能是账户组6 workflow 最后的 Delete artifacts 已经把结果删掉了，只能填仍有 artifact 的 run_id 或重新跑一次组6。"
            exit 1
          fi
          echo "下载到 ${json_count} 个 JSON 结果文件。"

      - name: Normalize group6 metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = 0
          rows = 0
          for path in Path("results").rglob("*.json"):
              if path.name.lower() == "manifest.json":
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              result_rows = payload.get("results") if isinstance(payload, dict) else None
              if not isinstance(result_rows, list):
                  continue
              payload["batch_name"] = payload.get("batch_name") or "账户组6"
              payload["group_name"] = "账户组6"
              payload["group_number"] = 6
              for row in result_rows:
                  if not isinstance(row, dict):
                      continue
                  account_index = int(row.get("account_index") or 0)
                  row["group_name"] = "账户组6"
                  row["group_number"] = 6
                  row["group_position"] = f"6组账号{account_index}" if account_index else "6组账号"
                  rows += 1
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              files += 1
          if files == 0 or rows == 0:
              raise SystemExit("下载到的 artifacts 中没有可汇总的 result.json。")
          print(f"已补齐组6元数据: files={files}, rows={rows}")
          PY

      - name: Summarize and notify
        env:
          OUTPUT_XLSX_PATH: results/sign-summary-batch6.xlsx
          GROUP_NAME: 账户组6
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.count }}
          TOTAL_ACCOUNTS: ${{ needs.prepare.outputs.count }}
          NOTIFY_CHANNELS: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USE_SSL: ${{ secrets.SMTP_SSL }}
          RISK_CONTROL_MESSAGE: ${{ secrets.RISK_CONTROL_MESSAGE }}
          ACCOUNTS_BATCH6: ${{ secrets.ACCOUNTS_BATCH6 }}
          TELEGRAM_SEND_XLSX: ${{ inputs.telegram_xlsx }}
          TELEGRAM_SEND_TEXT: ${{ inputs.telegram_text }}
        run: |
          echo "当前 results 目录下的文件："
          find results -maxdepth 3 -type f | sort
          python h3/report.py results
