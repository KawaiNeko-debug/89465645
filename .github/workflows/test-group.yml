name: test-group

run-name: test-group-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      task_start_date:
        description: 留空时使用上海当天日期
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/dynamic-group.yml
    with:
      orchestration_id: ${{ github.run_id }}
      group_code: test
      task_start_date: ${{ inputs.task_start_date }}
    secrets: inherit

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-22.04
    env:
      TEST: ${{ secrets.TEST }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_CHANNELS: telegram
      TEST_ACCOUNT_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: group-result-${{ github.run_id }}-test
          path: results/test
      - name: Install report dependencies
        run: python -m pip install --timeout 60 --retries 3 requests openpyxl
      - name: Generate and send test report
        run: python h3/test_report.py results "${{ github.run_id }}" "${{ inputs.task_start_date }}"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: |
            results/manifest.json
            results/*.xlsx
          if-no-files-found: warn
          retention-days: 3
