name: test-group

run-name: test-group-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      task_start_date:
        description: 留空时使用上海当天日期
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      task_start_date: ${{ steps.date.outputs.task_start_date }}
    steps:
      - id: date
        env:
          REQUESTED_DATE: ${{ inputs.task_start_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          value = os.environ.get('REQUESTED_DATE', '').strip()
          if not value:
              value = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'task_start_date={value}\n')
          PY

  test:
    needs: prepare
    uses: ./.github/workflows/dynamic-batch.yml
    with:
      orchestration_id: ${{ github.run_id }}
      batch_id: test
      task_start_date: ${{ needs.prepare.outputs.task_start_date }}
      continue_chain: false
      chain_state: ""
      test_mode: true
    secrets: inherit

  summary:
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-22.04
    env:
      TEST: ${{ secrets.TEST }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONFIDENTIAL_PASSWORDS: ${{ secrets.CONFIDENTIAL_PASSWORDS }}
      NOTIFY_CHANNELS: telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: h3/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: batch-result-${{ github.run_id }}-test
          path: results/test
      - name: Install report dependencies
        run: python -m pip install --timeout 60 --retries 3 requests openpyxl
      - name: Generate and send test report
        run: python h3/test_report.py results "${{ github.run_id }}" "${{ needs.prepare.outputs.task_start_date }}"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: |
            results/manifest.json
            results/*.xlsx
          if-no-files-found: warn
          retention-days: 3
